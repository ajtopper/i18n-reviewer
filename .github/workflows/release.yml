name: Release Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading 'v', e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag and version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}".TrimStart("v")
            $tag = "v$ver"
          } else {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart("v")
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtual environment and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Run mypy and pytest
        shell: pwsh
        run: |
          .\.venv\Scripts\mypy.exe app
          .\.venv\Scripts\python.exe -m pytest -v

      - name: Ensure Inno Setup (iscc) is available
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6"
            if (Test-Path (Join-Path $defaultPath "ISCC.exe")) {
              "$defaultPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            } else {
              choco install innosetup -y
              if (Test-Path (Join-Path $defaultPath "ISCC.exe")) {
                "$defaultPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              }
            }
          }

      - name: Build Windows bundle, run --self-test, ZIP and Installer
        shell: pwsh
        run: .\scripts\package_windows.ps1 -Version "${{ steps.meta.outputs.version }}" -BuildInstaller

      - name: Run frozen suite test against built dist
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest tests\test_packaging_selftest.py -v

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $files = @(
            "dist\i18n-reviewer-$ver-setup-win64.exe",
            "dist\i18n-reviewer-$ver-win64.zip"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $f
            "$hash  $name"
          }
          $lines | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: i18n Reviewer ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/i18n-reviewer-${{ steps.meta.outputs.version }}-setup-win64.exe
            dist/i18n-reviewer-${{ steps.meta.outputs.version }}-win64.zip
            dist/SHA256SUMS.txt

