name: Release Windows & Linux AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading 'v', e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release tag and version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}".TrimStart("v")
            $tag = "v$ver"
          } else {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart("v")
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtual environment and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Run mypy and pytest
        shell: pwsh
        run: |
          .\.venv\Scripts\mypy.exe app
          .\.venv\Scripts\python.exe -m pytest -v

      - name: Ensure Inno Setup (iscc) is available
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6"
            if (Test-Path (Join-Path $defaultPath "ISCC.exe")) {
              "$defaultPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            } else {
              choco install innosetup -y
              if (Test-Path (Join-Path $defaultPath "ISCC.exe")) {
                "$defaultPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              }
            }
          }

      - name: Build Windows bundle, run --self-test, ZIP and Installer
        shell: pwsh
        run: .\scripts\package_windows.ps1 -Version "${{ needs.prepare.outputs.version }}" -BuildInstaller

      - name: Run frozen suite test against built dist
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest tests\test_packaging_selftest.py -v

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/i18n-reviewer-${{ needs.prepare.outputs.version }}-setup-win64.exe
            dist/i18n-reviewer-${{ needs.prepare.outputs.version }}-win64.zip

  build-linux-appimage:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Linux build and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libenchant-2-2 \
            enchant-2 \
            libhunspell-dev \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libfontconfig1 \
            libdbus-1-3 \
            file

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run mypy and pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/mypy app
          .venv/bin/python -m pytest -v

      - name: Build Linux AppImage and run --self-test
        run: bash scripts/package_linux_appimage.sh --version "${{ needs.prepare.outputs.version }}"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/i18n-reviewer-${{ needs.prepare.outputs.version }}-x86_64.AppImage

  publish-release:
    needs: [prepare, build-windows, build-linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd release-files
          sha256sum \
            "i18n-reviewer-${{ needs.prepare.outputs.version }}-setup-win64.exe" \
            "i18n-reviewer-${{ needs.prepare.outputs.version }}-win64.zip" \
            "i18n-reviewer-${{ needs.prepare.outputs.version }}-x86_64.AppImage" \
            > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: i18n Reviewer ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            release-files/i18n-reviewer-${{ needs.prepare.outputs.version }}-setup-win64.exe
            release-files/i18n-reviewer-${{ needs.prepare.outputs.version }}-win64.zip
            release-files/i18n-reviewer-${{ needs.prepare.outputs.version }}-x86_64.AppImage
            release-files/SHA256SUMS.txt
